name: Machinewright Site

on:
  pull_request:
    paths: ["site/**", "src/**"]
  push:
    branches: [main]
    paths: ["site/**", "src/**"]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Regenerate API reference
        run: uv run --with griffe python site/scripts/generate_api_docs.py
      - run: git diff --exit-code -- site/src/content/docs/docs/reference
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: machinewright-site
          path: site/dist
