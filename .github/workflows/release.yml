name: Machinewright Release

# Push a version tag (the bump2version flow creates these) to build the macOS
# app, package it as a DMG, attach it to the workflow run as an artifact, and
# publish it on the GitHub release page.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        run: |
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          # Anything with a "-" (e.g. 0.1.0-rc.12) is a pre-release.
          case "$TAG" in *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;; *) echo "PRERELEASE=false" >> "$GITHUB_ENV" ;; esac

      - name: Check tag matches pyproject version
        run: |
          py_version=$(grep -m1 '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$py_version" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match pyproject.toml version $py_version"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      - run: npm run build:web
        working-directory: app

      - run: pod install --project-directory=macos
        working-directory: app

      - name: Build Release app
        working-directory: app/macos
        run: |
          xcodebuild -workspace MachinewrightApp.xcworkspace \
            -scheme MachinewrightApp-macOS -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Stamp version and ad-hoc sign
        run: |
          APP="$RUNNER_TEMP/derived/Build/Products/Release/MachinewrightApp.app"
          test -d "$APP"
          # Info.plist carries a static version, so stamp the real one here.
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION%%-*}" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" "$APP/Contents/Info.plist"
          # Ad-hoc signature (no Developer ID yet) so the bundle is internally valid.
          codesign --force --deep --sign - --entitlements app/macos/MachinewrightApp-macOS/MachinewrightApp.entitlements "$APP"
          codesign --verify --deep --strict "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Package DMG
        run: |
          mkdir -p dist-release stage
          cp -R "$APP" stage/
          ln -s /Applications stage/Applications
          DMG="dist-release/Machinewright-${VERSION}-macOS-arm64.dmg"
          hdiutil create -volname "Machinewright ${VERSION}" -srcfolder stage \
            -fs HFS+ -format UDZO -ov "$DMG"
          (cd dist-release && shasum -a 256 "$(basename "$DMG")" > "$(basename "$DMG").sha256")
          ls -lh dist-release

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Machinewright-${{ env.VERSION }}-macOS-arm64
          path: dist-release/*
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/* --clobber
          else
            gh release create "$TAG" dist-release/* --title "Machinewright $VERSION" "${flags[@]}"
          fi
