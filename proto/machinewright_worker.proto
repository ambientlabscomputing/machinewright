syntax = "proto3";

package machinewright.worker.v1;

message Hello {
  uint32 protocol_version = 1;
  repeated string capabilities = 2;
}

message SourceOverlay {
  string relative_path = 1;
  bytes content = 2;
}

message EvaluateProject {
  string session_id = 1;
  uint64 generation = 2;
  string project_root = 3;
  string template_id = 4;
  string template_version = 5;
  bytes inputs_json = 6;
  string output_directory = 7;
  repeated SourceOverlay overlays = 8;
  string environment_digest = 9;
}

message CancelEvaluation {
  string session_id = 1;
  uint64 generation = 2;
}

message Shutdown {}

// Sweep messages (RFD-19 M3, "Hardware function laboratory"): one
// `EvaluateSweepPoint` evaluates a single point of a 1D or 2D parameter
// sweep. Unlike `EvaluateProject`, results are addressed by
// (session_id, sweep_id, point_index) rather than a single generation, so
// they can be dispatched across a pool of worker processes and completed
// out of order.
message SweepCoordinate {
  string parameter_path = 1;
  double value = 2;
}

message EvaluateSweepPoint {
  string session_id = 1;
  uint64 sweep_id = 2;
  uint32 point_index = 3;
  repeated SweepCoordinate coordinates = 4;
  string project_root = 5;
  string template_id = 6;
  string template_version = 7;
  bytes baseline_inputs_json = 8;
  string output_directory = 9;
  repeated SourceOverlay overlays = 10;
  string environment_digest = 11;
}

message CancelSweep {
  string session_id = 1;
  uint64 sweep_id = 2;
}

// Export jobs: on-demand exports into a user-chosen folder, addressed by
// (session_id, job_id) rather than an evaluation generation so they never
// interfere with the live-preview evaluation stream. `kind` is "parts" or
// "print_plan"; `options_json` is that kind's options document.
message RunExportJob {
  string session_id = 1;
  uint64 job_id = 2;
  string project_root = 3;
  string template_id = 4;
  string template_version = 5;
  bytes inputs_json = 6;
  repeated SourceOverlay overlays = 7;
  string environment_digest = 8;
  string kind = 9;
  string output_directory = 10;
  bytes options_json = 11;
  string basename = 12;
}

message CancelExportJob {
  string session_id = 1;
  uint64 job_id = 2;
}

message WorkerRequest {
  oneof request {
    Hello hello = 1;
    EvaluateProject evaluate = 2;
    CancelEvaluation cancel = 3;
    Shutdown shutdown = 4;
    EvaluateSweepPoint evaluate_sweep_point = 5;
    CancelSweep cancel_sweep = 6;
    RunExportJob run_export_job = 7;
    CancelExportJob cancel_export_job = 8;
  }
}

message CapabilityReport {
  uint32 protocol_version = 1;
  repeated string capabilities = 2;
  string python_version = 3;
  string interpreter = 4;
  string machinewright_version = 5;
  string cad_backend_version = 6;
  repeated string transports = 7;
}

message EvaluationProgress {
  string session_id = 1;
  uint64 generation = 2;
  string stage = 3;
  uint32 completed = 4;
  uint32 total = 5;
  string message = 6;
}

message PartialDiagnostics {
  string session_id = 1;
  uint64 generation = 2;
  bytes diagnostics_json = 3;
}

message SourceDigest {
  string relative_path = 1;
  string digest = 2;
}

message EvaluationCompleted {
  string session_id = 1;
  uint64 generation = 2;
  string snapshot_path = 3;
  string graph_digest = 4;
  string artifact_manifest_digest = 5;
  // Digest of every project file the worker actually read while producing
  // this evaluation (the materialized overlay root, including files not
  // themselves overlaid) — lets a caller that independently reads the
  // project tree for caching detect a concurrent external edit that
  // diverged from what was actually evaluated, without transferring full
  // source bytes back over the protocol.
  repeated SourceDigest evaluated_sources = 6;
}

message EvaluationFailed {
  string session_id = 1;
  uint64 generation = 2;
  string code = 3;
  string message = 4;
  string traceback = 5;
  bytes diagnostics_json = 6;
}

message EvaluationCancelled {
  string session_id = 1;
  uint64 generation = 2;
}

message SweepPointCompleted {
  string session_id = 1;
  uint64 sweep_id = 2;
  uint32 point_index = 3;
  string snapshot_path = 4;
  string graph_digest = 5;
  string artifact_manifest_digest = 6;
}

message SweepPointFailed {
  string session_id = 1;
  uint64 sweep_id = 2;
  uint32 point_index = 3;
  string code = 4;
  string message = 5;
}

message SweepPointCancelled {
  string session_id = 1;
  uint64 sweep_id = 2;
  uint32 point_index = 3;
}

message EvaluationInputSchema {
  string session_id = 1;
  uint64 generation = 2;
  bytes schema_json = 3;
}

message ExportJobProgress {
  string session_id = 1;
  uint64 job_id = 2;
  string stage = 3;
  uint32 completed = 4;
  uint32 total = 5;
  string message = 6;
}

message ExportJobCompleted {
  string session_id = 1;
  uint64 job_id = 2;
  string output_directory = 3;
  bytes result_json = 4;
}

message ExportJobFailed {
  string session_id = 1;
  uint64 job_id = 2;
  string code = 3;
  string message = 4;
  string traceback = 5;
}

message ExportJobCancelled {
  string session_id = 1;
  uint64 job_id = 2;
}

message WorkerEvent {
  oneof event {
    CapabilityReport capabilities = 1;
    EvaluationProgress progress = 2;
    PartialDiagnostics diagnostics = 3;
    EvaluationCompleted completed = 4;
    EvaluationFailed failed = 5;
    EvaluationCancelled cancelled = 6;
    SweepPointCompleted sweep_point_completed = 7;
    SweepPointFailed sweep_point_failed = 8;
    SweepPointCancelled sweep_point_cancelled = 9;
    EvaluationInputSchema input_schema = 10;
    ExportJobProgress export_progress = 11;
    ExportJobCompleted export_completed = 12;
    ExportJobFailed export_failed = 13;
    ExportJobCancelled export_cancelled = 14;
  }
}
