[project]
name = "machinewright"
version = "0.1.0-rc.11"
description = "A parametric CAD framework: composable, parametrized hardware objects and assemblies as code."
readme = "README.md"
authors = [
    { name = "Jose Catarino", email = "jfcatarino1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cadquery>=2.8.0",
    "cookiecutter>=2.7.1,<3",
    "pydantic>=2.13.4",
    "protobuf>=6.31.0",
    "result>=0.17.0",
    "typer>=0.27.1",
    # Language server for the native editor (RFD-19). Core, not optional: the
    # app spawns <project>/.venv/bin/pylsp, so every project that depends on
    # machinewright must get it. pyflakes/pycodestyle are opt-in extras of
    # python-lsp-server, not core deps, yet its bundled plugin imports them.
    "python-lsp-server[pyflakes,pycodestyle]>=1.12.0",
]

[project.scripts]
machinewright = "machinewright.main:app"
machinewright-worker = "machinewright.worker:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "ruff>=0.16.2",
    "pytest>=8.0.0",
    "bump2version>=1.0.1",
    "ty==0.0.79",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["machinewright"]

[[tool.mypy.overrides]]
module = [
    "machinewright.assemblies.base",
    "machinewright.commands.*",
    "machinewright.discovery",
    "machinewright.lib.bom",
    "machinewright.lib.materials",
    "machinewright.objects.base",
    "machinewright.protocol.*",
    "machinewright.registry",
]
ignore_errors = true

[tool.ruff]
# Target Python version
target-version = "py313"

# Same as Black.
line-length = 88

# Exclude a variety of common directories.
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "src/machinewright/protocol/machinewright_worker_pb2.py",
    "src/machinewright/protocol/machinewright_worker_pb2.pyi",
]

[tool.ruff.lint]
# Enable Pyflakes (F) and Error (E) codes by default.
# "I" enables isort for import sorting.
select = ["E", "F", "I", "W", "B", "C90", "N"]
ignore = [
    "E501", # Line too long (handled by formatter)
]

# Allow fixable rules to be automatically fixed.
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
# Ensure imports are grouped logically
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect the line length.
line-ending = "auto"
